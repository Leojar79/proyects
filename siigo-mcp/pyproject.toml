[project]
name = "siigo-mcp"
version = "0.1.0"
description = "Servidor MCP para la API de Siigo Nube (Colombia)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp>=2.3,<3",
    "httpx[socks]>=0.28,<1",
    "pydantic>=2.12",
    "anyio>=4.9",
]

[project.scripts]
siigo-mcp = "siigo_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/siigo_mcp"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
