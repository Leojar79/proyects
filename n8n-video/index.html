<script>
/* =========================================================
   Utilidades
   ========================================================= */
const T = 35;
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const ease=x=>{x=clamp(x);return x*x*(3-2*x)};
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const lerp=(a,b,p)=>a+(b-a)*p;
const win=(t,a,b,d=0.3)=>Math.min(ease(seg(t,a,a+d)),1-ease(seg(t,b-d,b)));
const $=s=>document.querySelector(s);
const world=$('#world');
function el(tag,cls,html,style){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;if(style)Object.assign(e.style,style);return e}

/* =========================================================
   Iconos (SVG en línea)
   ========================================================= */
const ICON={
 gmail:'<svg viewBox="0 0 48 48"><path fill="#4caf50" d="M45,16.2l-5,2.75l-5,4.75L35,40h7c1.657,0,3-1.343,3-3V16.2z"/><path fill="#1e88e5" d="M3,16.2l3.614,1.71L13,23.7V40H6c-1.657,0-3-1.343-3-3V16.2z"/><polygon fill="#e53935" points="35,11.2 24,19.45 13,11.2 12,17 13,23.7 24,31.95 35,23.7 36,17"/><path fill="#c62828" d="M3,12.298V16.2l10,7.5V11.2L9.876,8.859C9.132,8.301,8.228,8,7.298,8h0C4.924,8,3,9.924,3,12.298z"/><path fill="#fbc02d" d="M45,12.298V16.2l-10,7.5V11.2l3.124-2.341C38.868,8.301,39.772,8,40.702,8h0C43.076,8,45,9.924,45,12.298z"/></svg>',
 filter:'<svg viewBox="0 0 24 24" fill="rgba(255,255,255,.18)" stroke="#fff" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"><path d="M3 4h18l-7 8.5V19l-4 2v-8.5z"/></svg>',
 openai:'<svg viewBox="-26 -26 52 52" fill="none" stroke="#fff" stroke-width="2.6" stroke-linejoin="round">'+[0,1,2,3,4,5].map(i=>`<rect x="-5.2" y="-23" width="10.4" height="23" rx="5.2" transform="rotate(${i*60})"/>`).join('')+'</svg>',
 pencil:'<svg viewBox="0 0 24 24" fill="rgba(255,255,255,.92)" stroke="#fff" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg>',
 sheets:'<svg viewBox="0 0 48 48"><path fill="#43a047" d="M37,45H11c-1.657,0-3-1.343-3-3V6c0-1.657,1.343-3,3-3h19l10,10v29C40,43.657,38.657,45,37,45z"/><path fill="#c8e6c9" d="M40 13L30 13 30 3z"/><path fill="#2e7d32" d="M30 13L40 23 40 13z"/><path fill="#e8f5e9" d="M31,23H17h-2v2v2v2v2v2v2v2h18v-2v-2v-2v-2v-2v-2v-2H31z M17,25h4v2h-4V25z M17,29h4v2h-4V29z M17,33h4v2h-4V33z M31,35h-8v-2h8V35z M31,31h-8v-2h8V31z M31,27h-8v-2h8V27z"/></svg>',
 notion:'<svg viewBox="0 0 48 48"><rect x="6" y="6" width="36" height="36" rx="6" fill="#fff" stroke="#111" stroke-width="2.6"/><text x="24" y="35" text-anchor="middle" font-family="Liberation Serif,DejaVu Serif,serif" font-weight="800" font-size="30" fill="#111">N</text></svg>',
 slack:'<svg viewBox="0 0 100 100"><rect x="56" y="6" width="17" height="44" rx="8.5" fill="#36c5f0"/><rect x="50" y="56" width="44" height="17" rx="8.5" fill="#2eb67d"/><rect x="27" y="50" width="17" height="44" rx="8.5" fill="#ecb22e"/><rect x="6" y="27" width="44" height="17" rx="8.5" fill="#e01e5a"/><circle cx="35" cy="15" r="8.5" fill="#36c5f0"/><circle cx="85" cy="35" r="8.5" fill="#2eb67d"/><circle cx="65" cy="85" r="8.5" fill="#ecb22e"/><circle cx="15" cy="65" r="8.5" fill="#e01e5a"/></svg>',
 trash:'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg>',
};

/* =========================================================
   Nodos
   ========================================================= */
const X0=360, DX=300, Y=520;
const N=[
 {name:'Nuevo correo',sub:'Gmail Trigger',tile:'#ffffff',icon:ICON.gmail,trigger:true},
 {name:'Filtrar correos',sub:'IF',tile:'linear-gradient(145deg,#2fb86a,#1d8a4e)',icon:ICON.filter,two:true},
 {name:'Extraer información con IA',sub:'OpenAI',tile:'linear-gradient(145deg,#19b88f,#0e8c6c)',icon:ICON.openai},
 {name:'Formatear datos',sub:'Set',tile:'linear-gradient(145deg,#4a85ff,#2859e0)',icon:ICON.pencil},
 {name:'Guardar en Sheets',sub:'Google Sheets',tile:'#ffffff',icon:ICON.sheets},
 {name:'Crear tarea',sub:'Notion',tile:'#ffffff',icon:ICON.notion},
 {name:'Notificar al equipo',sub:'Slack',tile:'#ffffff',icon:ICON.slack},
 {name:'Fin',sub:'Éxito',tile:'linear-gradient(145deg,#4a3410,#2b1d08)',emoji:'🏆',gold:true},
 {name:'Correo ignorado',sub:'No hacer nada',tile:'linear-gradient(145deg,#6a6cf5,#4547d8)',icon:ICON.trash},
];
N.forEach((n,i)=>{ n.x=i<8?X0+i*DX:X0+2*DX; n.y=i<8?Y:850; });
// run windows [inicio, fin] de cada nodo
const RUNS=[[[4.0,4.9],[26.2,26.7]],[[5.9,7.0],[27.2,27.9]],[[8.0,10.6]],[[11.5,12.5]],[[13.3,14.9]],[[15.9,17.2]],[[18.2,20.8]],[[21.8,22.6]],[[28.6,29.1]]];

N.forEach((n,i)=>{
  const d=el('div','node',null,{left:(n.x-52)+'px',top:(n.y-52)+'px'});
  const box=el('div','box',n.emoji?`<span class="emo">${n.emoji}</span>`:n.icon,{background:n.tile});
  d.appendChild(box);
  if(i>0) d.appendChild(el('div','port in'));
  if(n.two){ d.appendChild(el('div','port out',null,{top:'25px'})); d.appendChild(el('div','port out',null,{top:'65px'})); }
  else if(i<7) d.appendChild(el('div','port out',null,{top:'45px'}));
  if(n.trigger) d.appendChild(el('div','bolt','⚡'));
  const badge=el('div','badge'); d.appendChild(badge);
  d.appendChild(el('div','lbl',`<b>${n.name}</b><span>${n.sub}</span>`));
  n.box=box; n.badge=badge; n.dom=d;
  world.appendChild(d);
});

/* =========================================================
   Conexiones
   ========================================================= */
const svgNS='http://www.w3.org/2000/svg';
const wiresSvg=document.createElementNS(svgNS,'svg');

const OV=[1410,700,.76];
const CAM=[[0,...OV],[2.2,...OV],[3.0,360,410,1.25],[5.1,360,410,1.25],[5.9,660,410,1.25],[7.2,660,410,1.25],[8.0,960,410,1.25],[10.7,960,410,1.25],[11.5,1260,410,1.25],[12.6,1260,410,1.25],[13.3,1560,410,1.25],[15.0,1560,410,1.25],[15.9,1860,410,1.25],[17.4,1860,410,1.25],[18.2,2160,410,1.25],[21.0,2160,410,1.25],[21.8,2460,410,1.25],[24.4,2460,410,1.25],[25.4,660,620,1.0],[29.4,660,620,1.0],[30.6,...OV],[T,...OV]];
function camAt(t){
  for(let i=0;i<CAM.length-1;i++){const a=CAM[i],b=CAM[i+1];
    if(t>=a[0]&&t<=b[0]){const p=ease((t-a[0])/(b[0]-a[0]));return[lerp(a[1],b[1],p),lerp(a[2],b[2],p),lerp(a[3],b[3],p)]}}
  return CAM[CAM.length-1].slice(1);
}

/* ---------- confeti ---------- */
const cv=$('#confetti'),cx=cv.getContext('2d');
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=rng(42),PCOL=['#ff6d5a','#ffd166','#34d399','#4a85ff','#c084fc','#ff4fa3','#ffffff'];
const PARTS=Array.from({length:150},()=>({ang:-Math.PI/2+(R()-.5)*2.6,sp:500+R()*1000,rot:R()*6.28,vr:(R()-.5)*14,sz:8+R()*10,c:PCOL[Math.floor(R()*PCOL.length)],w:.5+R()}));
function drawConfetti(t){
  cx.clearRect(0,0,1920,1080);
  const tau=t-22.4; if(tau<0||tau>4)return;
  for(const p of PARTS){
    const k=(1-Math.exp(-2.2*tau))/2.2;
    const x=960+Math.cos(p.ang)*p.sp*k, y=470+Math.sin(p.ang)*p.sp*k+0.5*1500*tau*tau*0.55;
    cx.save();cx.globalAlpha=1-seg(tau,2.6,3.9);cx.translate(x,y);cx.rotate(p.rot+p.vr*tau);cx.fillStyle=p.c;cx.fillRect(-p.sz/2,-p.sz*p.w/2,p.sz,p.sz*p.w);cx.restore();
  }
}

/* =========================================================
   RENDER (determinista: todo depende de t)
   ========================================================= */
window.__T=T;
window.__render=function(t){
  // cámara
  const [cxw,cyw,z]=camAt(t);
  world.style.transform=`translate(${960-cxw*z}px,${540-cyw*z}px) scale(${z})`;
  const dots=$('#dots'); dots.style.backgroundSize=`${28*z}px ${28*z}px`; dots.style.backgroundPosition=`${960-cxw*z}px ${540-cyw*z}px`;

  // nodos
  N.forEach((n,i)=>{
    const runs=RUNS[i]; let running=false; for(const [a,b] of runs) if(t>=a&&t<b) running=true;
    const done=!running&&t>=runs[0][1];
    const b=n.badge, bx=n.box;
    if(running){
      b.style.display='flex';b.className='badge run';b.textContent='';b.style.transform=`rotate(${t*540}deg)`;
      bx.style.borderColor='#ff9a3c';bx.style.boxShadow='0 0 0 5px rgba(255,154,60,.22),0 0 36px rgba(255,154,60,.55),0 8px 24px rgba(0,0,0,.45)';
    }else if(done){
      b.style.display='flex';b.className='badge '+(i===8?'gray':'ok');b.textContent='✓';b.style.transform='none';
      const col=i===8?'#8d93ab':(n.gold?'#ffd166':'#34d399');
      const age=Math.max(...runs.map(r=>t>=r[1]?t-r[1]:-1));
      const glow=Math.max(0,1-age/1.2);
      bx.style.borderColor=col;bx.style.boxShadow=`0 0 0 ${4*glow}px ${i===8?'rgba(141,147,171,.25)':'rgba(52,211,153,.25)'},0 0 ${14+30*glow}px ${i===8?'rgba(141,147,171,.35)':'rgba(52,211,153,'+(.25+.4*glow)+')'},0 8px 24px rgba(0,0,0,.45)`;
    }else{
      b.style.display='none';bx.style.borderColor='#3d3d56';bx.style.boxShadow='0 8px 24px rgba(0,0,0,.45)';
    }
  });
  // trigger en espera
  listen.style.opacity=win(t,0.4,4.0,.4)*(0.75+0.25*Math.sin(t*6));
  listen.style.transform=`translateX(-50%) translateY(${Math.sin(t*4)*3}px)`;

  // conexiones
  WIRES.forEach(w=>{
    const P=w.pulses; const p0=P[0];
    const fillP=ease(seg(t,p0[0],p0[1]));
    w.fill.setAttribute('stroke-dasharray',`${w.len*fillP} ${w.len+10}`);
    w.itemsEl.style.opacity=ease(seg(t,p0[1],p0[1]+.3));
    let act=null; for(const p of P) if(t>=p[0]&&t<=p[1]) act=p;
    w.trail.forEach((d,k)=>{
      if(!act){d.style.display='none';return}
      const p=ease((t-act[0])/(act[1]-act[0]));
      const pk=clamp(p-k*.045); const pt=w.path.getPointAtLength(w.len*pk);
      d.style.display='block';d.style.left=pt.x+'px';d.style.top=pt.y+'px';
    });
  });

  // paneles
  PANELS.forEach(p=>{
    const o=win(t,p.a,p.b,.35);
    if(o<=0.001){p.dom.style.opacity=0;return}
    const html=p.r(t); if(html!==p.last){p.dom.innerHTML=html;p.last=html}
    p.dom.style.opacity=o;
    p.dom.style.transform=`translateY(calc(-100% - ${(1-o)*18}px)) scale(${.95+.05*o})`;
  });

  // correos entrantes
  MAILS.forEach(m=>{
    const g=N[0]; const p=ease(seg(t,m.a,m.b));
    if(t<m.a||t>m.b){m.dom.style.opacity=0;return}
    const x=lerp(g.x-640,g.x-30,p);
    const sc=1-.55*ease(seg(t,m.b-.3,m.b));
    m.dom.style.left=(x-155)+'px';
    m.dom.style.opacity=Math.min(seg(t,m.a,m.a+.25),1-seg(t,m.b-.2,m.b));
    m.dom.style.transform=`scale(${sc})`;
  });

  // subtítulo
  let c=null; for(const k of CAPS) if(t>=k.a&&t<k.b) c=k;
  if(c){ if(capT.textContent!==c.t){capNum.textContent=c.n;capT.textContent=c.t;capS.textContent=c.s}
    cap.style.opacity=win(t,c.a,c.b,.3); cap.style.transform=`translateX(-50%) translateY(${(1-win(t,c.a,c.b,.3))*14}px)`;
  } else cap.style.opacity=0;

  // chip de estado
  const running=(t>=3.0&&t<22.6)||(t>=25.5&&t<29.1);
  const finished=(t>=22.6&&t<25.5)||t>=29.1;
  if(t<2.6||t>30.3){status.style.opacity=0}
  else{
    status.style.opacity=1;
    if(running){status.className='';status.innerHTML='<span class="dot" style="opacity:'+(0.55+0.45*Math.sin(t*9))+'"></span>Ejecutando flujo…'}
    else if(finished){status.className='ok';status.innerHTML='✔ Ejecución exitosa'}
    else{status.className='idle';status.innerHTML='Esperando eventos'}
  }

  // introducción
  const intro=$('#intro');
  const io=Math.min(seg(t,0,.5),1-seg(t,2.2,3.0));
  intro.style.opacity=io; intro.style.display=io<=0.001&&t>1?'none':'flex';
  intro.style.transform=`scale(${1+.06*seg(t,2.2,3.0)})`;

  // resultado final
  const fo=ease(seg(t,30.5,31.4));
  $('#title2').style.opacity=ease(seg(t,30.8,31.6));
  $('#title2').style.transform=`translateY(${(1-ease(seg(t,30.8,31.6)))*-20}px)`;
  const cl=$('#cardL'),cr=$('#cardR');
  cl.style.opacity=fo;cl.style.transform=`translateY(${(1-fo)*40}px)`;
  const fo2=ease(seg(t,30.9,31.8));
  cr.style.opacity=fo2;cr.style.transform=`translateY(${(1-fo2)*40}px)`;

  $('#prog').style.width=(t/T*1920)+'px';
  drawConfetti(t);
};
window.__render(0);
